<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ruroon._.g ARCHIVE</title>
  <style>
    :root {
      --pink: #ECA8B9;
      --navy: #1C2038;
      --white: #FFFFFF;
    }

    /* 클릭 도장 효과 (A05.png) */
    .click-stamp {
      position: fixed;
      width: 32px;
      height: 32px;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%) scale(0.6);
      animation: stamp-pop 0.6s ease-out forwards;
    }

    @keyframes stamp-pop {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.6); }
      50% { opacity: 0.9; transform: translate(-50%, -50%) scale(1.1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.3); }
    }

    /* 관리자 버튼 (A04.png) */
    .admin-trigger-btn {
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .admin-trigger-btn:hover {
      transform: scale(1.1);
    }
    .admin-trigger-btn img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>

  <!-- 관리자 로그인 버튼 영역 (A04.png) -->
  <button class="admin-trigger-btn" onclick="openAdminLogin()" title="Admin Login">
    <img src="./images/A04.png" alt="Admin Access">
  </button>

  <script>
    /* 마우스 클릭 시 A05.png 도장 생성 */
    document.addEventListener('click', function(e) {
      const stamp = document.createElement('img');
      stamp.src = './images/A05.png';
      stamp.className = 'click-stamp';
      stamp.style.left = e.clientX + 'px';
      stamp.style.top = e.clientY + 'px';

      document.body.appendChild(stamp);

      setTimeout(() => {
        stamp.remove();
      }, 600);
    });

    function openAdminLogin() {
      // 로그인 모달 오픈 함수
      document.getElementById('modal-login')?.classList.add('show');
    }
  </script>
</body>
</html>
